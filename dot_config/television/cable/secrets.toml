[metadata]
name = "secrets"
description = "Select a stored credential and copy its password to the clipboard"
requirements = ["secrets"]

[source]
# Pads the service column to the longest service name so usernames line up
command = """secrets list | awk -F'\\t' '{ s[NR]=$1; u[NR]=$2; if (length($1) > m) m = length($1) } END { for (i = 1; i <= NR; i++) printf "%-*s  %s\\n", m, s[i], u[i] }'"""

[preview]
# Deliberately does NOT call `secrets get`, so no password is shown while browsing
command = """echo '{}' | awk '{ print "Service:  " $1; print "Username: " $2 }'"""

[keybindings]
enter = ["actions:copy-password", "quit"]

[actions.copy-password]
description = "Copy the password to the clipboard"
command = """echo '{}' | xargs sh -c 'secrets get "$0" "$1"'"""
mode = "fork"
